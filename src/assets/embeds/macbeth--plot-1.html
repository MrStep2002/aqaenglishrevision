<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --bg:#111; --panel:#222; --gold:#f2c744; --text:#fff; }
    body { font-family: Georgia, serif; background:var(--bg); color:var(--gold); margin:0; padding:18px; text-align:center; }
    h1 { color:var(--text); margin: 6px 0 10px; font-size: 1.9em; }
    #instructions { margin: 0 auto 14px; max-width: 780px; line-height: 1.35; color: #f6e6a8; }

    .hud {
      display:flex; justify-content:center; gap:10px; flex-wrap:wrap;
      margin: 10px 0 14px;
    }
    .pill {
      background: #1a1a1a;
      border: 1px solid rgba(242,199,68,0.6);
      padding: 8px 12px;
      border-radius: 999px;
      font-weight: 700;
      color: var(--gold);
    }

    #events { display:flex; flex-direction:column; gap:10px; align-items:center; margin: 0 auto 14px; max-width: 820px; }
    .event {
      width: min(820px, 94vw);
      background: var(--panel);
      border: 2px solid var(--gold);
      border-radius: 10px;
      padding: 12px 14px;
      text-align: left;
      color: #ffe9a6;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .event strong { color: var(--text); }
    .event.selected { outline: 3px solid var(--text); transform: translateY(-1px); }

    .controls {
      position: sticky; bottom: 0;
      background: linear-gradient(180deg, rgba(17,17,17,0.0), rgba(17,17,17,0.9) 25%, rgba(17,17,17,1));
      padding: 12px 0 6px;
      margin-top: 10px;
    }
    .btnRow { display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }

    button {
      padding: 12px 16px;
      font-size: 1.05em;
      background: var(--gold);
      color: #000;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 800;
      min-width: 140px;
    }
    button:disabled { opacity: 0.35; cursor:not-allowed; }

    #result { margin: 10px 0 0; font-weight: 900; font-size: 1.15em; color: var(--text); }
    #subResult { margin: 6px 0 0; color: #f6e6a8; }

    .win {
      margin-top: 14px;
      background: #0f0f0f;
      border: 2px solid var(--gold);
      border-radius: 12px;
      padding: 14px;
      max-width: 760px;
      margin-left:auto; margin-right:auto;
      color: #ffe9a6;
    }

    @media (max-width: 420px) {
      button { min-width: 46vw; }
      h1 { font-size: 1.6em; }
    }
  </style>
</head>
<body>
  <h1>Plot Scramble: Macbeth</h1>
  <div id="instructions">
    Tap an event to select it. Use ↑ / ↓ to move it. Try to put all events in the right order.
  </div>

  <div class="hud">
    <div class="pill" id="picked">Selected: —</div>
    <div class="pill" id="progress">Correct positions: 0 / 0</div>
  </div>

  <div id="events"></div>

  <div class="controls">
    <div class="btnRow">
      <button id="upBtn" disabled>↑ Move Up</button>
      <button id="downBtn" disabled>↓ Move Down</button>
      <button id="checkBtn">Check</button>
      <button id="replayBtn" style="display:none;">New Round</button>
    </div>
    <div id="result" role="status" aria-live="polite"></div>
    <div id="subResult"></div>
  </div>

  <script>
    const correctSequences = [
      [
        "Macbeth and Banquo meet the witches",
        "Lady Macbeth persuades Macbeth to kill Duncan",
        "Macbeth murders King Duncan",
        "Macbeth sees Banquo’s ghost at the banquet",
        "Macduff kills Macbeth and Malcolm becomes king"
      ],
      [
        "Lady Macbeth reads Macbeth’s letter",
        "Macbeth is made Thane of Cawdor",
        "Duncan names Malcolm Prince of Cumberland",
        "Lady Macbeth persuades Macbeth to kill Duncan",
        "Macbeth murders King Duncan"
      ],
      [
        "Macbeth visits the witches a second time",
        "The witches tell Macbeth he cannot be harmed by anyone born of a woman",
        "Birnam Wood comes to Dunsinane",
        "Lady Macbeth dies off-stage",
        "Macduff kills Macbeth and Malcolm becomes king"
      ],
      [
        "Banquo is murdered on Macbeth's orders",
        "Fleance escapes the murderers",
        "Macbeth sees Banquo’s ghost at the banquet",
        "Macduff's family is murdered",
        "Lady Macbeth sleepwalks and reveals her guilt"
      ],
      [
        "Macbeth and Banquo meet the witches",
        "Macbeth is made Thane of Cawdor",
        "Duncan names Malcolm Prince of Cumberland",
        "Lady Macbeth persuades Macbeth to kill Duncan",
        "Macbeth murders King Duncan"
      ]
    ];

    const eventsEl = document.getElementById('events');
    const pickedEl = document.getElementById('picked');
    const progressEl = document.getElementById('progress');
    const resultEl = document.getElementById('result');
    const subResultEl = document.getElementById('subResult');

    const upBtn = document.getElementById('upBtn');
    const downBtn = document.getElementById('downBtn');
    const checkBtn = document.getElementById('checkBtn');
    const replayBtn = document.getElementById('replayBtn');

    let sequence = [];
    let selectedIndex = null;

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function render(list) {
      eventsEl.innerHTML = '';
      list.forEach((text, idx) => {
        const div = document.createElement('div');
        div.className = 'event';
        div.innerHTML = `<strong>${idx + 1}.</strong> ${text}`;
        div.addEventListener('click', () => select(idx));
        eventsEl.appendChild(div);
      });
      updateUI();
      updateProgress();
    }

    function select(idx) {
      selectedIndex = idx;
      updateUI();
    }

    function updateUI() {
      [...eventsEl.children].forEach((el, idx) => {
        el.classList.toggle('selected', idx === selectedIndex);
      });

      if (selectedIndex === null) {
        pickedEl.textContent = 'Selected: —';
        upBtn.disabled = true;
        downBtn.disabled = true;
        return;
      }

      pickedEl.textContent = `Selected: ${selectedIndex + 1}`;
      upBtn.disabled = selectedIndex === 0;
      downBtn.disabled = selectedIndex === eventsEl.children.length - 1;
    }

    function moveSelected(delta) {
      if (selectedIndex === null) return;
      const items = getCurrent();
      const newIndex = selectedIndex + delta;
      if (newIndex < 0 || newIndex >= items.length) return;

      const temp = items[selectedIndex];
      items[selectedIndex] = items[newIndex];
      items[newIndex] = temp;

      selectedIndex = newIndex;
      render(items);
    }

    function getCurrent() {
      return [...eventsEl.children].map(el => el.textContent.replace(/^\d+\.\s*/, ''));
    }

    function countCorrectPositions(current) {
      let correct = 0;
      for (let i = 0; i < sequence.length; i++) {
        if (current[i] === sequence[i]) correct++;
      }
      return correct;
    }

    function updateProgress() {
      const current = getCurrent();
      const correct = countCorrectPositions(current);
      progressEl.textContent = `Correct positions: ${correct} / ${sequence.length}`;
    }

    function initGame() {
      sequence = correctSequences[Math.floor(Math.random() * correctSequences.length)];
      const shuffled = shuffle([...sequence]);

      selectedIndex = null;
      resultEl.textContent = '';
      subResultEl.textContent = '';
      replayBtn.style.display = 'none';
      checkBtn.style.display = 'inline-block';

      render(shuffled);
      progressEl.textContent = `Correct positions: 0 / ${sequence.length}`;
    }

    upBtn.addEventListener('click', () => moveSelected(-1));
    downBtn.addEventListener('click', () => moveSelected(1));

    // Update progress live after any click/move (render calls updateProgress)
    eventsEl.addEventListener('click', () => setTimeout(updateProgress, 0));

    checkBtn.addEventListener('click', () => {
      const current = getCurrent();
      const correct = countCorrectPositions(current);
      const isCorrect = correct === sequence.length;

      if (isCorrect) {
        resultEl.textContent = "✅ Perfect — you fixed the plot!";
        subResultEl.innerHTML = `<div class="win">Nice. Try another round to practise a different chain of events.</div>`;
      } else {
        resultEl.textContent = `❌ Not yet — ${correct} / ${sequence.length} are in the right position.`;
        subResultEl.textContent = "Tip: select an item and move it one step at a time.";
      }

      replayBtn.style.display = 'inline-block';
    });

    replayBtn.addEventListener('click', initGame);

    window.addEventListener('load', initGame);
  </script>
</body>
</html>
