<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Macbeth Quiz</title>
    <style>
        body {
            font-family: 'Arial', sans-serif; 
            background: url('https://www.transparenttextures.com/patterns/black-linen.png'); 
            background-color: #2f4f4f; 
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }
        .question-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 600px;
            padding: 10px;
            box-sizing: border-box;
        }
        .question {
            font-size: 1.5em;
            margin-bottom: 20px;
            word-wrap: break-word;
        }
        .option-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .option-box {
            background-color: #4f4f4f;
            padding: 15px;
            margin: 10px;
            flex: 1 1 calc(50% - 20px);
            border-radius: 5px;
            cursor: pointer;
            text-align: center;
            transition: background-color 0.3s;
            box-sizing: border-box;
        }
        .option-box input[type="radio"] {
            display: none;
        }
        .option-box label {
            cursor: pointer;
            font-size: 1.2em;
            width: 100%;
            display: block;
            box-sizing: border-box;
        }
        .option-box:hover {
            background-color: #6b6b6b;
        }
        .feedback {
            color: #00ff00;
            margin-top: 10px;
        }
        .final-score {
            font-size: 1.5em;
            color: #ff0000;
        }
        .button {
            background-color: #a3c9f1;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        .score-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #4f4f4f;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1.5em;
        }
        @media (max-width: 600px) {
            .question {
                font-size: 1.2em;
            }
            .option-box {
                padding: 10px;
                margin: 5px;
                font-size: 1em;
            }
            .final-score {
                font-size: 1.2em;
            }
            .score-container {
                font-size: 1.2em;
                padding: 8px 16px;
            }
        }
    </style>
</head>
<body>

<div class="question-container">
    <div class="question" id="question"></div>
    <div id="game">
        <div class="option-container">
            <div class="option-box" onclick="selectOption(0)">
                <input type="radio" name="answer" value="0" id="option0">
                <label for="option0" id="label0"></label>
            </div>
            <div class="option-box" onclick="selectOption(1)">
                <input type="radio" name="answer" value="1" id="option1">
                <label for="option1" id="label1"></label>
            </div>
            <div class="option-box" onclick="selectOption(2)">
                <input type="radio" name="answer" value="2" id="option2">
                <label for="option2" id="label2"></label>
            </div>
            <div class="option-box" onclick="selectOption(3)">
                <input type="radio" name="answer" value="3" id="option3">
                <label for="option3" id="label3"></label>
            </div>
        </div>
        <div class="feedback" id="feedback"></div>
    </div>
    <div id="final-score" class="final-score" style="display: none;"></div>
    <button class="button" onclick="restartGame()" style="display: none;" id="restartButton">REPLAY</button>
</div>
<div class="score-container" id="score">0</div>

<!-- Sound effects -->
<audio id="correctSound" src="https://drive.google.com/uc?export=download&id=14HLB8oy8E5kRmQKYYUG0nFsa0Ltlv0iJ" preload="auto"></audio>
<audio id="wrongSound" src="https://drive.google.com/uc?export=download&id=1DuXS8wkQCy8m7UzV_bQRwN7uzMqVMfDC" preload="auto"></audio>

<script>
const apiKey = 'AIzaSyBsLzSdSZoXOKzd4IEM2PB9L4Cw8iwPcys';
const spreadsheetId = '13xd2wbh6w6mWQPMmiopxEfagUP_iLsEOutMfeTfMT6I';
const range = 'Sheet3!A1:E20';  // Adjust the range if needed
let questions = [];
let usedQuestions = [];
let currentQuestion = 0;
let score = 0;
const maxQuestions = 10;
let allowSelection = true;

async function fetchQuestions() {
    try {
        const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        if (!data.values || data.values.length === 0) {
            throw new Error('No data found in the specified range.');
        }
        questions = data.values;
        loadQuestion();
    } catch (error) {
        console.error('Error fetching questions:', error);
        document.getElementById('feedback').textContent = `Error loading questions: ${error.message}`;
    }
}

function getRandomItem(array) {
    const randomIndex = Math.floor(Math.random() * array.length);
    return array[randomIndex];
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function loadQuestion() {
    if (currentQuestion >= maxQuestions) {
        document.getElementById('final-score').textContent = `Game Over! Your score is ${score} out of ${maxQuestions}.`;
        document.getElementById('final-score').style.display = 'block';
        document.getElementById('game').style.display = 'none';
        document.getElementById('restartButton').style.display = 'block';
        return;
    }

    let questionRow;
    do {
        questionRow = getRandomItem(questions);
    } while (usedQuestions.includes(questionRow));
    usedQuestions.push(questionRow);

    const question = questionRow[0];
    const correctAnswer = questionRow[1];
    const wrongAnswer1 = questionRow[2];
    const wrongAnswer2 = questionRow[3];
    const wrongAnswer3 = questionRow[4];

    const options = shuffle([correctAnswer, wrongAnswer1, wrongAnswer2, wrongAnswer3]);

    document.getElementById('question').textContent = question;
    document.getElementById('label0').textContent = options[0];
    document.getElementById('label1').textContent = options[1];
    document.getElementById('label2').textContent = options[2];
    document.getElementById('label3').textContent = options[3];

    document.getElementById('option0').dataset.correct = options[0] === correctAnswer;
    document.getElementById('option1').dataset.correct = options[1] === correctAnswer;
    document.getElementById('option2').dataset.correct = options[2] === correctAnswer;
    document.getElementById('option3').dataset.correct = options[3] === correctAnswer;

    document.getElementById('feedback').textContent = '';

    // Ensure none of the options are selected
    document.getElementById('option0').checked = false;
    document.getElementById('option1').checked = false;
    document.getElementById('option2').checked = false;
    document.getElementById('option3').checked = false;

    allowSelection = false;
    setTimeout(() => { allowSelection = true; }, 1000);
}

function selectOption(optionIndex) {
    if (!allowSelection) return;
    document.getElementById(`option${optionIndex}`).checked = true;
    checkAnswer(optionIndex);
}

function checkAnswer(answerIndex) {
    const correctSound = document.getElementById('correctSound');
    const wrongSound = document.getElementById('wrongSound');
    const isCorrect = document.getElementById(`option${answerIndex}`).dataset.correct === 'true';
    if (isCorrect) {
        score++;
        document.getElementById('score').textContent = score;
        correctSound.play();
    } else {
        wrongSound.play();
    }
    currentQuestion++;
    loadQuestion();
}

function restartGame() {
    currentQuestion = 0;
    score = 0;
    usedQuestions = [];
    document.getElementById('score').textContent = score;
    document.getElementById('final-score').style.display = 'none';
    document.getElementById('restartButton').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    fetchQuestions();
}

fetchQuestions();
</script>

</body>
</html>
