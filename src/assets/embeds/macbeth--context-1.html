<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Literary Device Defender - Macbeth Edition</title>
  <style>
    body { font-family: Arial, sans-serif; background: #1a1a1a; color: #fff; text-align: center; margin: 0; padding: 0; }
    h1 { background: #000; color: #f2c744; margin: 0; padding: 1em; }
    #game { padding: 20px; }
    .sentence { font-size: 1.4em; margin: 30px auto; background: #333; width: fit-content; padding: 15px; border: 2px solid #f2c744; border-radius: 10px; transition: transform 1s ease-in; }
    .choices { display: flex; justify-content: center; flex-wrap: wrap; margin-top: 20px; }
    .choice { margin: 10px; padding: 10px 20px; background: #f2c744; color: black; font-weight: bold; cursor: pointer; border-radius: 5px; transition: background 0.3s; }
    .choice:hover { background: #ffdb4d; }
    #result { margin-top: 30px; font-size: 1.2em; }
  </style>
</head>
<body>
  <h1>Literary Device Defender - Macbeth Edition</h1>
  <div id="game">
    <div class="sentence" id="sentence">Loading...</div>
    <div class="choices" id="choices"></div>
    <div id="result"></div>
  </div>
  <script>
    const questions = [
      {
        sentence: "Fair is foul, and foul is fair.",
        answer: "Paradox"
      },
      {
        sentence: "Look like the innocent flower, but be the serpent under't.",
        answer: "Metaphor"
      },
      {
        sentence: "Will all great Neptune’s ocean wash this blood clean from my hand?",
        answer: "Hyperbole"
      },
      {
        sentence: "Out, out, brief candle!",
        answer: "Metaphor"
      },
      {
        sentence: "Life’s but a walking shadow, a poor player that struts and frets his hour upon the stage.",
        answer: "Metaphor"
      },
      {
        sentence: "The raven himself is hoarse that croaks the fatal entrance of Duncan.",
        answer: "Personification"
      },
      {
        sentence: "Here’s the smell of the blood still. All the perfumes of Arabia will not sweeten this little hand.",
        answer: "Hyperbole"
      }
    ];

    const devices = ["Metaphor", "Simile", "Alliteration", "Personification", "Hyperbole", "Paradox"];

    let currentQuestion = 0;

    function showQuestion() {
      const q = questions[currentQuestion];
      const sentenceEl = document.getElementById("sentence");
      sentenceEl.innerText = q.sentence;
      sentenceEl.style.transform = "translateY(-200px)";
      setTimeout(() => sentenceEl.style.transform = "translateY(0)", 100);

      const choicesContainer = document.getElementById("choices");
      choicesContainer.innerHTML = "";
      devices.forEach(device => {
        const btn = document.createElement("div");
        btn.className = "choice";
        btn.innerText = device;
        btn.onclick = () => checkAnswer(device);
        choicesContainer.appendChild(btn);
      });
      document.getElementById("result").innerText = "";
    }

    function checkAnswer(selected) {
      const correct = questions[currentQuestion].answer;
      if (selected === correct) {
        document.getElementById("result").innerText = "✅ Correct!";
      } else {
        document.getElementById("result").innerText = `❌ Wrong! Correct answer: ${correct}`;
      }
      currentQuestion = (currentQuestion + 1) % questions.length;
      setTimeout(showQuestion, 2000);
    }

    showQuestion();
  </script>
</body>
</html>
