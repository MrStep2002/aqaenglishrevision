<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Fire!</title>
    <style>
        body { 
            font-family: 'Arial', sans-serif; 
            background: url('https://www.transparenttextures.com/patterns/black-linen.png'); 
            background-color: #2f4f4f; 
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .question { 
            font-size: 1.5em; 
            margin-bottom: 20px; 
        }
        .feedback { 
            color: #00ff00; 
            margin-top: 10px; 
        }
        .final-score { 
            font-size: 1.5em; 
            color: #ff0000; 
        }
        .button {
            background-color: #a3c9f1;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        .option-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        .option-box {
            background-color: #4f4f4f;
            padding: 20px;
            margin: 10px 0;
            width: 80%;
            max-width: 600px;
            border-radius: 5px;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.3s;
        }
        .option-box input[type="radio"] {
            display: none;
        }
        .option-box label { 
            cursor: pointer; 
            font-size: 1.2em; 
            width: 100%;
            display: block;
        }
        .option-box:hover {
            background-color: #6b6b6b;
        }
        .score-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #4f4f4f;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 1.5em;
        }
    </style>
</head>
<body>

<div class="question" id="question">Which sentence is WRONG?</div>
<div id="game">
    <div class="option-container">
        <div class="option-box" onclick="selectOption(0)">
            <input type="radio" name="answer" value="0" id="option0"> 
            <label for="option0" id="label0"></label>
        </div>
        <div class="option-box" onclick="selectOption(1)">
            <input type="radio" name="answer" value="1" id="option1"> 
            <label for="option1" id="label1"></label>
        </div>
        <div class="option-box" onclick="selectOption(2)">
            <input type="radio" name="answer" value="2" id="option2"> 
            <label for="option2" id="label2"></label>
        </div>
    </div>
    <div class="feedback" id="feedback"></div>
</div>
<div id="final-score" class="final-score" style="display: none;"></div>
<button class="button" onclick="restartGame()" style="display: none;" id="restartButton">REPLAY</button>
<div class="score-container" id="score">0</div>

<script>
const apiKey = 'AIzaSyBsLzSdSZoXOKzd4IEM2PB9L4Cw8iwPcys';
const spreadsheetId = '1Xg1-pzXcsW7mXY-2zTVH-4_N06lAEPzoGfSncTUjAhk';
const range = 'Sheet1!A1:C25';  // Adjust the range if needed
let questions = [];
let currentQuestion = 0;
let score = 0;

async function fetchQuestions() {
    try {
        const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`);
        if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}`);
        }
        const data = await response.json();
        if (!data.values || data.values.length === 0) {
            throw new Error('No data found in the specified range.');
        }
        questions = data.values.map(row => ({
            options: shuffle([row[0], row[1], row[2]]),
            correct: row[0],
            feedback: [
                `Correct! "${row[0]}" is the correct sentence.`,
                `Incorrect. The correct sentence is "${row[0]}".`,
                `Incorrect. The correct sentence is "${row[0]}".`
            ]
        }));
        loadQuestion();
    } catch (error) {
        console.error('Error fetching questions:', error);
        document.getElementById('feedback').textContent = `Error loading questions: ${error.message}`;
    }
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function loadQuestion() {
    if (currentQuestion >= questions.length) {
        document.getElementById('final-score').textContent = `Game Over! Your score is ${score} out of ${questions.length}.`;
        document.getElementById('final-score').style.display = 'block';
        document.getElementById('game').style.display = 'none';
        document.getElementById('restartButton').style.display = 'block';
        return;
    }

    const question = questions[currentQuestion];
    document.getElementById('label0').textContent = question.options[0];
    document.getElementById('label1').textContent = question.options[1];
    document.getElementById('label2').textContent = question.options[2];
    document.getElementById('feedback').textContent = '';

    // Ensure none of the options are selected
    document.getElementById('option0').checked = false;
    document.getElementById('option1').checked = false;
    document.getElementById('option2').checked = false;
}

function selectOption(optionIndex) {
    document.getElementById(`option${optionIndex}`).checked = true;
    checkAnswer(optionIndex);
}

function checkAnswer(answer) {
    const question = questions[currentQuestion];
    if (question.options[answer] === question.correct) {
        score++;
        document.getElementById('score').textContent = score;
    }
    currentQuestion++;
    loadQuestion();
}

function restartGame() {
    currentQuestion = 0;
    score = 0;
    document.getElementById('score').textContent = score;
    document.getElementById('final-score').style.display = 'none';
    document.getElementById('restartButton').style.display = 'none';
    document.getElementById('game').style.display = 'block';
    fetchQuestions();
}

fetchQuestions();
</script>

</body>
</html>
