<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Order Game</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: url('https://www.transparenttextures.com/patterns/black-linen.png'); 
            background-color: #2f4f4f; 
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
        }
        .container { 
            display: flex; 
            flex-wrap: wrap; 
            margin-bottom: 20px; 
            justify-content: center; 
            width: 100%;
            max-width: 800px;
            padding: 10px;
            box-sizing: border-box;
        }
        .word, .dropzone { 
            padding: 10px; 
            margin: 5px; 
            border: 1px solid #ccc; 
            cursor: pointer; 
            background-color: #4f4f4f; 
            color: #fff;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-size: 1em;
        }
        .completed { background-color: #6b8e23; }
        .selected { background-color: #bbdefb; }
        .button {
            background-color: #a3c9f1;
            border: none;
            color: white;
            padding: 10px 20px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 5px;
        }
        .overlay { 
            display: none; 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            background-color: rgba(0, 0, 0, 0.8); 
            color: #a3c9f1; 
            font-size: 2em; 
            justify-content: center; 
            align-items: center; 
            z-index: 1000;
            flex-direction: column;
            text-align: center;
        }
        @media (max-width: 600px) {
            .timer, .button {
                font-size: 1.2em;
            }
            .word, .dropzone {
                font-size: 0.9em;
            }
            .overlay {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>

<h1>Word Order Game</h1>
<div class="timer" id="timer">Time: 60s</div>
<div class="container" id="wordContainer">
    <!-- Words will be populated here -->
</div>
<div class="container" id="dropZoneContainer">
    <!-- Drop zones will be populated here -->
</div>
<div class="overlay" id="overlay">
    <div id="overlay-text"></div>
    <button class="button" onclick="replayGame()">REPLAY</button>
</div>

<script>
const apiKey = 'AIzaSyBsLzSdSZoXOKzd4IEM2PB9L4Cw8iwPcys';
const spreadsheetId = '1Xg1-pzXcsW7mXY-2zTVH-4_N06lAEPzoGfSncTUjAhk';
const range = 'Sheet3!A:A';  // Adjust the range if needed

let phrases = [];
let currentPhrase = '';
let words = [];
let selectedWordElement = null;
let startTime = null;
let timerInterval = null;
let gameTimerInterval = null;
let timeRemaining = 60;
let phrasesCompleted = 0;

async function fetchPhrases() {
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`);
    const data = await response.json();
    phrases = data.values.map(row => row[0]);
}

function startGameTimer() {
    gameTimerInterval = setInterval(() => {
        timeRemaining--;
        document.getElementById('timer').textContent = `Time: ${timeRemaining}s`;
        if (timeRemaining <= 0) {
            clearInterval(gameTimerInterval);
            endGame();
        }
    }, 1000);
}

function createWordElements() {
    const wordContainer = document.getElementById('wordContainer');
    wordContainer.innerHTML = ''; // Clear existing words
    words.forEach(word => {
        const div = document.createElement('div');
        div.textContent = word;
        div.classList.add('word');
        div.addEventListener('click', handleWordClick);
        div.addEventListener('dblclick', handleWordDoubleClick);
        wordContainer.appendChild(div);
    });

    const dropZoneContainer = document.getElementById('dropZoneContainer');
    dropZoneContainer.innerHTML = ''; // Clear existing drop zones
    for (let i = 0; i < words.length; i++) {
        const div = document.createElement('div');
        div.classList.add('dropzone');
        div.dataset.index = i;
        div.addEventListener('click', handleDropZoneClick);
        dropZoneContainer.appendChild(div);
    }
}

function handleWordClick(e) {
    if (!startTime) {
        startTime = Date.now();
        startGameTimer();
    }

    if (selectedWordElement) {
        selectedWordElement.classList.remove('selected');
    }

    selectedWordElement = e.target;
    selectedWordElement.classList.add('selected');
}

function handleWordDoubleClick(e) {
    if (!startTime) {
        startTime = Date.now();
        startGameTimer();
    }

    const wordElement = e.target;
    const dropZones = document.querySelectorAll('.dropzone');

    for (let dropZone of dropZones) {
        if (!dropZone.textContent) {
            dropZone.textContent = wordElement.textContent;
            dropZone.classList.add('completed');
            wordElement.remove();
            break;
        }
    }
    checkOrder();
}

function handleDropZoneClick(e) {
    if (selectedWordElement) {
        if (e.target.classList.contains('dropzone')) {
            if (e.target.textContent) {
                const temp = e.target.textContent;
                e.target.textContent = selectedWordElement.textContent;
                selectedWordElement.textContent = temp;
            } else {
                e.target.textContent = selectedWordElement.textContent;
                selectedWordElement.remove();
            }
            selectedWordElement.classList.remove('selected');
            selectedWordElement = null;
            e.target.classList.add('completed');
        }
    } else if (e.target.classList.contains('completed')) {
        if (selectedWordElement) {
            selectedWordElement.classList.remove('selected');
        }
        selectedWordElement = e.target;
        selectedWordElement.classList.add('selected');
    }
    checkOrder();
}

function checkOrder() {
    const dropZones = document.querySelectorAll('.dropzone');
    const userPhrase = Array.from(dropZones).map(zone => zone.textContent.trim()).join(' ');
    if (userPhrase.split(' ').sort().join(' ') === currentPhrase.split(' ').sort().join(' ')) {
        phrasesCompleted++;
        if (timeRemaining > 0) {
            loadNewPhrase();
        } else {
            endGame();
        }
    }
}

function loadNewPhrase() {
    if (phrases.length === 0) {
        alert('No more phrases available.');
        endGame();
        return;
    }
    const randomIndex = Math.floor(Math.random() * phrases.length);
    currentPhrase = phrases[randomIndex];
    words = currentPhrase.split(" ").sort(() => Math.random() - 0.5);
    createWordElements();
}

function endGame() {
    clearInterval(timerInterval);
    clearInterval(gameTimerInterval);
    document.getElementById('overlay-text').textContent = `Game Over! You completed ${phrasesCompleted} phrases.`;
    document.getElementById('overlay').style.display = 'flex';
}

function replayGame() {
    document.getElementById('overlay').style.display = 'none';
    phrasesCompleted = 0;
    timeRemaining = 60;
    fetchPhrases().then(loadNewPhrase);
}

window.onload = () => {
    fetchPhrases().then(loadNewPhrase);
}
</script>

</body>
</html>
