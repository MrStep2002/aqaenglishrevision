<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jeopardy Game</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; }
        .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin: 20px; }
        .cell { padding: 20px; background-color: #4f4f4f; color: #fff; cursor: pointer; text-align: center; }
        .question { margin: 20px; }
    </style>
</head>
<body>
    <h1>Jeopardy Game</h1>
    <div class="board" id="board">
        <div class="cell" onclick="selectQuestion('Characters', 100)">Characters - 100</div>
        <div class="cell" onclick="selectQuestion('Plot', 100)">Plot - 100</div>
        <div class="cell" onclick="selectQuestion('Quotes', 100)">Quotes - 100</div>
        <div class="cell" onclick="selectQuestion('Themes', 100)">Themes - 100</div>
        <div class="cell" onclick="selectQuestion('Settings', 100)">Settings - 100</div>
        <!-- Add more cells as needed -->
    </div>
    <div class="question" id="question"></div>
    <script>
        const questions = {
            Characters: {
                100: { question: "Who is the main character?", answer: "Scrooge" }
                // Add more questions as needed
            },
            Plot: {
                100: { question: "What is Scrooge's first name?", answer: "Ebenezer" }
                // Add more questions as needed
            }
            // Add more categories as needed
        };

        function selectQuestion(category, value) {
            const questionData = questions[category][value];
            document.getElementById('question').textContent = questionData.question;
            const answer = prompt(questionData.question);
            if (answer.toLowerCase() === questionData.answer.toLowerCase()) {
                alert('Correct!');
            } else {
                alert(`Incorrect. The correct answer was ${questionData.answer}.`);
            }
        }
    </script>
</body>
</html>
