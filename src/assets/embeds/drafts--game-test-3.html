<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Matching Game</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background: url('https://www.transparenttextures.com/patterns/black-linen.png');
            background-color: #2f4f4f;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            box-sizing: border-box;
        }

        .timer {
            font-size: 1.5em;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .container {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            width: 90%;
            max-width: 800px;
            padding: 10px;
            box-sizing: border-box;
        }

        .list {
            width: 45%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .list div {
            width: 90%;
            padding: 10px;
            margin: 5px 0;
            border: 2px solid #ccc;
            cursor: pointer;
            background-color: #4f4f4f;
            color: #fff;
            border-radius: 5px;
            transition: background-color 0.3s;
            font-size: 1em;
        }

        .list div:hover {
            background-color: #6b6b6b;
        }

        .selected {
            background-color: #bbdefb !important;
            border-color: #2196f3;
        }

        .matched {
            background-color: #6b8e23;
            pointer-events: none;
        }

        .correct {
            background-color: #4caf50 !important;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            color: #a3c9f1;
            font-size: 2em;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
            text-align: center;
        }

        .button {
            background-color: #a3c9f1;
            border: none;
            color: white;
            padding: 15px 30px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 1em;
            margin-top: 20px;
            cursor: pointer;
            border-radius: 5px;
        }

        @media (max-width: 600px) {
            .timer {
                font-size: 1.2em;
            }

            .list div {
                font-size: 0.9em;
            }

            .overlay {
                font-size: 1.5em;
            }
        }
    </style>
</head>
<body>

<div class="timer" id="timer">Time: 0s</div>
<div class="container">
    <div class="list" id="words">
        <!-- Words will be populated here -->
    </div>
    <div class="list" id="definitions">
        <!-- Definitions will be populated here -->
    </div>
</div>
<div class="overlay" id="overlay">
    <div id="overlay-text"></div>
    <button class="button" onclick="replayGame()">REPLAY</button>
</div>

<script>
const apiKey = 'AIzaSyBsLzSdSZoXOKzd4IEM2PB9L4Cw8iwPcys';
const spreadsheetId = '1Xg1-pzXcsW7mXY-2zTVH-4_N06lAEPzoGfSncTUjAhk';
const range = 'Sheet2!A1:B50';  // Adjust the range if needed

let words = [];
let definitions = [];
let shuffledDefinitions = [];
let selectedWord = null;
let selectedDefinition = null;
let timerInterval = null;
let startTime = null;

async function fetchWordsAndDefinitions() {
    const response = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${range}?key=${apiKey}`);
    const data = await response.json();
    const values = data.values;

    if (!values || values.length === 0) {
        throw new Error('No data found in the specified range.');
    }

    const selectedRows = getRandomSubarray(values, 5);

    words = selectedRows.map(row => row[0]);
    definitions = selectedRows.map(row => row[1]);

    shuffledDefinitions = shuffle([...definitions]);
    createList(words, 'words');
    createList(shuffledDefinitions, 'definitions');
}

function getRandomSubarray(arr, size) {
    const shuffled = arr.slice();
    let i = arr.length;
    const min = i - size;
    while (i-- > min) {
        const index = Math.floor((i + 1) * Math.random());
        const temp = shuffled[index];
        shuffled[index] = shuffled[i];
        shuffled[i] = temp;
    }
    return shuffled.slice(min);
}

function startTimer() {
    startTime = Date.now();
    timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('timer').textContent = `Time: ${elapsed}s`;
    }, 1000);
}

function createList(items, containerId) {
    const container = document.getElementById(containerId);
    container.innerHTML = ''; // Clear any existing content
    items.forEach((item, index) => {
        const div = document.createElement('div');
        div.textContent = item;
        div.dataset.index = index;
        div.addEventListener('click', () => handleItemClick(containerId, index));
        container.appendChild(div);
    });
}

function handleItemClick(containerId, index) {
    if (!startTime) {
        startTimer();
    }

    if (containerId === 'words') {
        selectedWord = index;
        highlightSelected(containerId, index);
    } else if (containerId === 'definitions') {
        selectedDefinition = index;
        highlightSelected(containerId, index);
    }

    if (selectedWord !== null && selectedDefinition !== null) {
        if (definitions[selectedWord] === shuffledDefinitions[selectedDefinition]) {
            matchItems(selectedWord, selectedDefinition);
        }
        selectedWord = null;
        selectedDefinition = null;
        clearHighlights();
    }
}

function highlightSelected(containerId, index) {
    const items = document.querySelectorAll(`#${containerId} div`);
    items.forEach(item => item.classList.remove('selected'));
    items[index].classList.add('selected');
}

function clearHighlights() {
    const wordItems = document.querySelectorAll(`#words div`);
    const definitionItems = document.querySelectorAll(`#definitions div`);
    wordItems.forEach(item => item.classList.remove('selected'));
    definitionItems.forEach(item => item.classList.remove('selected'));
}

function matchItems(wordIndex, definitionIndex) {
    const wordItem = document.querySelector(`#words div[data-index='${wordIndex}']`);
    const defItem = document.querySelector(`#definitions div[data-index='${definitionIndex}']`);
    wordItem.classList.add('matched');
    defItem.classList.add('matched');
    wordItem.classList.add('correct');
    defItem.classList.add('correct');
    checkGameOver();
}

function checkGameOver() {
    const matchedItems = document.querySelectorAll('.matched');
    if (matchedItems.length === words.length * 2) {
        clearInterval(timerInterval);
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        document.getElementById('overlay-text').textContent = `Good job! You matched them all in ${elapsed} seconds.`;
        document.getElementById('overlay').style.display = 'flex';
    }
}

function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
}

function replayGame() {
    document.getElementById('overlay').style.display = 'none';
    words = [];
    definitions = [];
    shuffledDefinitions = [];
    selectedWord = null;
    selectedDefinition = null;
    startTime = null;
    clearInterval(timerInterval);
    document.getElementById('timer').textContent = 'Time: 0s';
    fetchWordsAndDefinitions();
}

function initGame() {
    fetchWordsAndDefinitions();
}

window.onload = initGame;
</script>

</body>
</html>
