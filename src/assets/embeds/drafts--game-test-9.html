<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Builder</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; border: 1px solid #ccc; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 8px; box-sizing: border-box; }
        .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        .grid-container { display: grid; grid-template-columns: repeat(10, 30px); gap: 2px; }
        .grid-container input { width: 30px; height: 30px; text-align: center; font-size: 1.2em; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Crossword Builder</h1>
        <div class="form-group">
            <label for="grid">Enter Crossword Grid (10x10, use '.' for empty spaces):</label>
            <textarea id="grid" rows="10" placeholder="Enter grid, one line at a time."></textarea>
        </div>
        <div class="form-group">
            <label for="clues">Enter Clues and Answers (Format: clue:answer):</label>
            <textarea id="clues" rows="10" placeholder="Example: Main character of 'A Christmas Carol':SCROOGE"></textarea>
        </div>
        <button onclick="generateCode()">Generate Code</button>
        <h2>Generated Code:</h2>
        <pre id="generatedCode"></pre>
    </div>

    <script>
        function generateCode() {
            const grid = document.getElementById('grid').value.trim().split('\n');
            const clues = document.getElementById('clues').value.trim().split('\n');

            let crosswordArray = [];
            grid.forEach(line => {
                crosswordArray.push(line.split(''));
            });

            let cluesArray = [];
            clues.forEach(clue => {
                const [question, answer] = clue.split(':');
                cluesArray.push({ question, answer });
            });

            let htmlContent = `
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crossword Puzzle</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; flex-direction: column; align-items: center; }
        .crossword { display: grid; grid-template-columns: repeat(10, 30px); gap: 2px; }
        .crossword input { width: 30px; height: 30px; text-align: center; font-size: 1.2em; }
        .clues { margin-top: 20px; }
        .clue { margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Crossword Puzzle</h1>
    <div class="crossword" id="crossword">
        <!-- Crossword grid will be generated here -->
    </div>
    <div class="clues">
        ${cluesArray.map((clue, index) => `<div class="clue"><strong>${index + 1}. ${clue.question} (${clue.answer.length} letters)</strong></div>`).join('')}
    </div>
    <script>
        const crossword = ${JSON.stringify(crosswordArray)};

        function createCrossword() {
            const crosswordContainer = document.getElementById('crossword');
            for (let i = 0; i < crossword.length; i++) {
                for (let j = 0; j < crossword[i].length; j++) {
                    const input = document.createElement('input');
                    input.setAttribute('maxlength', '1');
                    if (crossword[i][j] !== ".") {
                        input.dataset.correct = crossword[i][j];
                    } else {
                        input.disabled = true;
                    }
                    crosswordContainer.appendChild(input);
                }
            }
        }

        function checkAnswers() {
            const inputs = document.querySelectorAll('#crossword input');
            inputs.forEach(input => {
                if (input.value.toUpperCase() === input.dataset.correct) {
                    input.style.backgroundColor = '#c8e6c9'; // correct
                } else {
                    input.style.backgroundColor = '#ffcdd2'; // incorrect
                }
            });
        }

        createCrossword();

        // Optional: Add a button to check answers
        const checkButton = document.createElement('button');
        checkButton.textContent = 'Check Answers';
        checkButton.onclick = checkAnswers;
        document.body.appendChild(checkButton);
    </script>
</body>
</html>
`;

            document.getElementById('generatedCode').textContent = htmlContent;
        }
    </script>
</body>
</html>
